

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Complaint Manager KSMA-ke</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{--blue:#2463eb;--orange:#f59e0b;--green:#16a34a;--ink:#172033;--muted:#64748b;--bg:#f3f6fb;--line:#e2e8f0}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}

header{background:#13294b;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

h1{font-size:20px;margin:0}

header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}

main{max-width:1100px;margin:22px auto;padding:0 14px}

.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #14284a0a}

.hidden{display:none!important}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.stat{cursor:pointer;border:0;text-align:left;color:white;border-radius:14px;padding:16px;min-height:92px}

.stat b{display:block;font-size:27px;margin-top:8px}

.total{background:#2563eb}.new{background:#f59e0b}.progress{background:#3984e8}.resolved{background:#16a34a}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.row>*{flex:1;min-width:130px}

input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);margin:5px 0}

textarea{min-height:85px;resize:vertical}

button{font:inherit;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:var(--blue);color:white;font-weight:600}

button.secondary{background:#e8eef8;color:#183153}

button.danger{background:#dc2626}

button.small{padding:7px 10px;font-size:13px}

.actions{display:flex;gap:6px;flex-wrap:wrap}

.muted{color:var(--muted);font-size:13px}

.titleline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}

h2{font-size:17px;margin:0 0 12px}

.complaint{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;background:#fff}

.complaint h3{font-size:16px;margin:0 0 7px}

.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}

.tag{display:inline-block;background:#edf2f8;border-radius:20px;padding:5px 9px;font-size:12px}

.tag.high{background:#fee2e2;color:#991b1b}

.tag.medium{background:#fef3c7;color:#92400e}

.tag.low{background:#dcfce7;color:#166534}

.notice{padding:11px;border-radius:9px;background:#eff6ff;color:#1d4ed8;margin:10px 0}

.error{background:#fef2f2;color:#b91c1c}

.auth{max-width:430px;margin:7vh auto;padding:22px}

.auth h2{font-size:22px}

.linkbtn{background:transparent;color:var(--blue);padding:8px 0}

.empty{text-align:center;padding:25px;color:var(--muted)}

@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{margin:12px auto}.panel{padding:14px}header{padding:15px}}

</style>

</head>

<body>

<header>

 <div><h1>Complaint Manager KSMA-ke</h1><p>Complaint tracking dashboard</p></div>

 <div id="topActions" class="actions hidden"><button class="secondary" id="changePassBtn">Change password</button><button id="logoutBtn">Log out</button></div>

</header>

<main>

<section id="authPanel" class="panel auth">

 <h2 id="authTitle">Sign in</h2><p class="muted">Use your registered account.</p>

 <div id="authNotice" class="notice hidden"></div>

 <form id="authForm">

  <div id="emailWrap"><label>Email</label><input id="email" type="email" autocomplete="email" required></div>

  <div id="passwordWrap"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>

  <div id="newPasswordWrap" class="hidden"><label>New password</label><input id="newPassword" type="password" minlength="6"></div>

  <button id="authSubmit" type="submit" style="width:100%;margin-top:8px">Sign in</button>

 </form>

 <div class="actions" style="margin-top:8px"><button class="linkbtn" id="forgotBtn" type="button">Forgot password?</button><button class="linkbtn hidden" id="backLoginBtn" type="button">Back to sign in</button></div>

</section>

<section id="appPanel" class="hidden">

 <div class="grid" id="stats">

  <button class="stat total" data-status="All">TOTAL<b id="totalCount">0</b></button>

  <button class="stat new" data-status="New">NEW<b id="newCount">0</b></button>

  <button class="stat progress" data-status="In Progress">IN PROGRESS<b id="progressCount">0</b></button>

  <button class="stat resolved" data-status="Resolved">RESOLVED<b id="resolvedCount">0</b></button>

 </div>

 <section class="panel" style="margin-top:16px">

  <div class="titleline"><h2 id="formTitle">Add a complaint</h2><button class="secondary" id="cancelEditBtn" type="button" hidden>Cancel edit</button></div>

  <div id="formNotice" class="notice hidden"></div>

  <form id="complaintForm">

   <input type="hidden" id="complaintId">

   <div class="row">

    <div><label>Department *</label><select id="department" required><option value="">Select department</option><option>Production</option><option>Planning</option><option>Traffic</option><option>Incoming</option><option>Finance</option><option>IE</option><option>Quality</option><option>HR</option><option>HSE</option><option>Logistics</option></select></div>

    <div><label>Project</label><input id="project" placeholder="Enter project name"></div>

   </div>

   <label>Subject *</label><input id="subject" required placeholder="Short complaint subject">

   <label>Details</label><textarea id="details" placeholder="Describe the complaint"></textarea>

   <div class="row">

    <div><label>Reported by</label><input id="reportedBy" placeholder="Your name"></div>

    <div><label>Responsible</label><input id="responsible" placeholder="Person or role responsible"></div>

   </div>

   <div class="row">

    <div><label>Priority</label><select id="priority"><option>Medium</option><option>High</option><option>Low</option></select></div>

    <div><label>Status</label><select id="status"><option>New</option><option>In Progress</option><option>Resolved</option></select></div>

   </div>

   <label>Root cause (optional)</label><textarea id="rootCause" placeholder="Root cause or corrective action"></textarea>

   <button id="saveBtn" type="submit">Save complaint</button>

  </form>

 </section>

 <section class="panel">

  <div class="titleline"><h2 id="listTitle">All complaints</h2><button class="secondary" id="clearFiltersBtn">Clear filters</button></div>

  <div class="row">

   <div><label>Search</label><input id="search" placeholder="Search subject, details, ID..."></div>

   <div><label>Department</label><select id="filterDepartment"><option value="">All departments</option></select></div>

   <div><label>Project</label><select id="filterProject"><option value="">All projects</option></select></div>

   <div><label>Priority</label><select id="filterPriority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div>

  </div>

  <div id="listNotice" class="notice hidden"></div><div id="complaintList"></div>

 </section>

</section>

<section id="passwordPanel" class="panel auth hidden">

 <h2>Change password</h2><div id="passwordNotice" class="notice hidden"></div>

 <form id="passwordForm"><label>New password</label><input id="changePassword" type="password" minlength="6" required><label>Confirm new password</label><input id="confirmPassword" type="password" minlength="6" required><button type="submit" style="width:100%">Update password</button></form>

 <button class="linkbtn" id="cancelPasswordBtn" type="button">Cancel</button>

</section>

</main>

<script>

(() => {

const SUPABASE_URL = 'https://aofyrjbnaxtcwcvikvca.supabase.co';

const SUPABASE_KEY = 'sb_publishable_Zu1jH3GRarnNS7bmyiLSyA_aM9aOONC';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let complaints = [], activeStatus = 'All', authMode = 'login';

const $ = id => document.getElementById(id);

const show = (id, yes=true) => $(id).classList.toggle('hidden', !yes);

function notice(id,msg,error=false){

 $(id).textContent=msg;

 show(id,!!msg);

 $(id).classList.toggle('error',error);

}

function esc(v){

 return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

}

function setAuthMode(mode){

 authMode=mode;

 notice('authNotice','');

 $('authTitle').textContent=mode==='forgot'?'Reset password':mode==='reset'?'Choose a new password':'Sign in';

 $('authSubmit').textContent=mode==='forgot'?'Send reset link':mode==='reset'?'Save new password':'Sign in';

 show('emailWrap',mode!=='reset');

 show('passwordWrap',mode==='login');

 show('newPasswordWrap',mode==='reset');

 $('password').required=mode==='login';

 $('newPassword').required=mode==='reset';

 show('forgotBtn',mode==='login');

 show('backLoginBtn',mode!=='login');

}

function setLoggedIn(on){

 show('authPanel',!on);

 show('appPanel',on);

 show('topActions',on);

 show('passwordPanel',false);

}

async function loadComplaints(){

 notice('listNotice','Loading complaints...');

 const {data,error}=await db.from('complaints').select('*').order('created_at',{ascending:false});

 if(error){notice('listNotice',error.message,true);return}

 complaints=data||[];

 notice('listNotice','');

 render();

}

function render(){

 $('totalCount').textContent=complaints.length;

 $('newCount').textContent=complaints.filter(c=>c.status==='New').length;

 $('progressCount').textContent=complaints.filter(c=>c.status==='In Progress').length;

 $('resolvedCount').textContent=complaints.filter(c=>c.status==='Resolved').length;

 const depts=[...new Set(complaints.map(c=>c.department).filter(Boolean))].sort();

 const projects=[...new Set(complaints.map(c=>c.project).filter(Boolean))].sort();

 const fill=(id,items,all)=>{

  const old=$(id).value;

  $(id).innerHTML='<option value="">'+all+'</option>'+items.map(x=>'<option>'+esc(x)+'</option>').join('');

  if(items.includes(old))$(id).value=old;

 };

 fill('filterDepartment',depts,'All departments');

 fill('filterProject',projects,'All projects');

 let list=complaints.filter(c=>

  (activeStatus==='All'||c.status===activeStatus)&&

  (!$('filterDepartment').value||c.department===$('filterDepartment').value)&&

  (!$('filterProject').value||c.project===$('filterProject').value)&&

  (!$('filterPriority').value||c.priority===$('filterPriority').value)

 );

 const q=$('search').value.trim().toLowerCase();

 if(q)list=list.filter(c=>[c.id,c.subject,c.details,c.department,c.project,c.reported_by,c.responsible].some(v=>String(v||'').toLowerCase().includes(q)));

 $('listTitle').textContent=(activeStatus==='All'?'All complaints':activeStatus+' complaints')+' ('+list.length+')';

 if(!list.length){

  $('complaintList').innerHTML='<div class="empty">No complaints found.</div>';

  return;

 }

 $('complaintList').innerHTML=list.map(c=>`

 <article class="complaint">

  <div class="titleline">

   <h3>#${esc(c.id)} · ${esc(c.subject)}</h3>

   <div class="actions">

    <button class="small secondary" data-edit="${esc(c.id)}">Edit</button>

    <button class="small danger" data-delete="${esc(c.id)}">Delete</button>

   </div>

  </div>

  <div class="meta">

   <span class="tag">${esc(c.status)}</span>

   <span class="tag ${String(c.priority||'Medium').toLowerCase()}">${esc(c.priority||'Medium')} priority</span>

   <span class="tag">${esc(c.department)}</span>

   ${c.project?`<span class="tag">${esc(c.project)}</span>`:''}

  </div>

  <p>${esc(c.details||'No details provided')}</p>

  <p class="muted">Reported by: ${esc(c.reported_by||'—')} · Responsible: ${esc(c.responsible||'—')} · ${c.created_at?new Date(c.created_at).toLocaleString():''}</p>

  ${c.root_cause?`<p><b>Root cause:</b> ${esc(c.root_cause)}</p>`:''}

  <div class="row">

   <div><label>Update status</label>

    <select data-status-id="${esc(c.id)}">

     <option ${c.status==='New'?'selected':''}>New</option>

     <option ${c.status==='In Progress'?'selected':''}>In Progress</option>

     <option ${c.status==='Resolved'?'selected':''}>Resolved</option>

    </select>

   </div>

   <div style="flex:0.5;align-self:end"><button class="small" data-update="${esc(c.id)}">Update status</button></div>

  </div>

 </article>`).join('');

}

$('authForm').addEventListener('submit',async e=>{

 e.preventDefault();

 notice('authNotice','Please wait...');

 let r;

 if(authMode==='login'){

  r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});

 }else if(authMode==='forgot'){

  r=await db.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:location.origin+location.pathname});

 }else{

  r=await db.auth.updateUser({password:$('newPassword').value});

  if(!r.error){

   notice('authNotice','Password updated. You can now sign in.');

   setAuthMode('login');

   return;

  }

 }

 if(r.error)notice('authNotice',r.error.message,true);

 else if(authMode==='forgot')notice('authNotice','If the email is registered, a reset link has been sent.');

 else notice('authNotice','Signed in.');

});

$('forgotBtn').onclick=()=>setAuthMode('forgot');

$('backLoginBtn').onclick=()=>setAuthMode('login');

$('logoutBtn').onclick=async()=>{

 await db.auth.signOut();

 setLoggedIn(false);

};

$('changePassBtn').onclick=()=>{

 show('appPanel',false);

 show('passwordPanel',true);

};

$('cancelPasswordBtn').onclick=()=>{

 show('passwordPanel',false);

 show('appPanel',true);

};

$('passwordForm').onsubmit=async e=>{

 e.preventDefault();

 if($('changePassword').value!==$('confirmPassword').value){

  notice('passwordNotice','Passwords do not match.',true);

  return;

 }

 const {error}=await db.auth.updateUser({password:$('changePassword').value});

 if(error)notice('passwordNotice',error.message,true);

 else{

  notice('passwordNotice','Password updated successfully.');

  $('passwordForm').reset();

 }

};

$('complaintForm').onsubmit=async e=>{

 e.preventDefault();

 const id=$('complaintId').value;

 const status=$('status').value;

 const old=complaints.find(c=>String(c.id)===id);

 const payload={

  department:$('department').value,

  project:$('project').value.trim(),

  subject:$('subject').value.trim(),

  details:$('details').value.trim(),

  reported_by:$('reportedBy').value.trim(),

  responsible:$('responsible').value.trim(),

  priority:$('priority').value,

  status,

  root_cause:$('rootCause').value.trim(),

  last_update:new Date().toISOString()

 };

 if(!payload.subject){

  notice('formNotice','Subject is required.',true);

  return;

 }

 if(status==='In Progress'&&(!old||old.status!=='In Progress'))payload.started_at=new Date().toISOString();

 if(status==='Resolved'&&(!old||old.status!=='Resolved'))payload.resolved_at=new Date().toISOString();

 let result=id

  ?await db.from('complaints').update(payload).eq('id',id)

  :await db.from('complaints').insert(payload);

 if(result.error){

  notice('formNotice',result.error.message,true);

  return;

 }

 notice('formNotice',id?'Complaint updated.':'Complaint saved.');

 $('complaintForm').reset();

 $('complaintId').value='';

 $('formTitle').textContent='Add a complaint';

 $('saveBtn').textContent='Save complaint';

 $('cancelEditBtn').hidden=true;

 await loadComplaints();

};

$('cancelEditBtn').onclick=()=>{

 $('complaintForm').reset();

 $('complaintId').value='';

 $('formTitle').textContent='Add a complaint';

 $('saveBtn').textContent='Save complaint';

 $('cancelEditBtn').hidden=true;

 notice('formNotice','');

};

$('complaintList').addEventListener('click',async e=>{

 const edit=e.target.closest('[data-edit]');

 const del=e.target.closest('[data-delete]');

 const upd=e.target.closest('[data-update]');

 if(edit){

  const c=complaints.find(x=>String(x.id)===edit.dataset.edit);

  if(!c)return;

  $('complaintId').value=c.id;

  for(const [id,key] of Object.entries({

   department:'department',

   project:'project',

   subject:'subject',

   details:'details',

   reportedBy:'reported_by',

   responsible:'responsible',

   priority:'priority',

   status:'status',

   rootCause:'root_cause'

  })){

   $(id).value=c[key]||(id==='priority'?'Medium':id==='status'?'New':'');

  }

  $('formTitle').textContent='Edit complaint #'+c.id;

  $('saveBtn').textContent='Save changes';

  $('cancelEditBtn').hidden=false;

  window.scrollTo({top:0,behavior:'smooth'});

 }

 if(del){

  if(!confirm('Delete this complaint permanently?'))return;

  const {error}=await db.from('complaints').delete().eq('id',del.dataset.delete);

  if(error)alert(error.message);

  else await loadComplaints();

 }

 if(upd){

  const id=upd.dataset.update;

  const status=document.querySelector(`[data-status-id="${CSS.escape(id)}"]`).value;

  const c=complaints.find(x=>String(x.id)===id);

  const p={status,last_update:new Date().toISOString()};

  if(status==='In Progress'&&c.status!=='In Progress')p.started_at=new Date().toISOString();

  if(status==='Resolved'&&c.status!=='Resolved')p.resolved_at=new Date().toISOString();

  const {error}=await db.from('complaints').update(p).eq('id',id);

  if(error)alert(error.message);

  else await loadComplaints();

 }

});

document.querySelectorAll('.stat').forEach(b=>b.onclick=()=>{

 activeStatus=b.dataset.status;

 render();

 $('listTitle').scrollIntoView({behavior:'smooth',block:'center'});

});

['search','filterDepartment','filterProject','filterPriority'].forEach(id=>

 $(id).addEventListener(id==='search'?'input':'change',render)

);

$('clearFiltersBtn').onclick=()=>{

 $('search').value='';

 $('filterDepartment').value='';

 $('filterProject').value='';

 $('filterPriority').value='';

 activeStatus='All';

 render();

};

db.auth.onAuthStateChange(async(event,session)=>{

 if(session){

  setLoggedIn(true);

  if(location.hash.includes('type=recovery')){

   setAuthMode('reset');

   setLoggedIn(false);

  }else{

   await loadComplaints();

  }

 }else{

  setLoggedIn(false);

 }

});

(async()=>{

 const {data:{session}}=await db.auth.getSession();

 if(session){

  setLoggedIn(true);

  if(location.hash.includes('type=recovery')){

   setAuthMode('reset');

   setLoggedIn(false);

  }else{

   await loadComplaints();

  }

 }else{

  setLoggedIn(false);

  if(location.hash.includes('type=recovery'))setAuthMode('reset');

 }

})();

})();

</script>

</body>

</html>
